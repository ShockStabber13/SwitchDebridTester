name: Build SwitchDebridTester

on:
  push:
    branches:
      - feature/torbox-standalone-speed-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clean stale locally generated build outputs
        run: make clean
      - name: Build NRO
        run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchDebridTester-TorBox-NRO
          path: SwitchDebridTester.nro
          if-no-files-found: error
